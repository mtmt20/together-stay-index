# Together-Stay Index dbt 프로젝트
# Bronze(S3 parquet) -> Silver(staging, S3를 httpfs로 직접 read_parquet) -> Gold(marts)
# 2026-09-18: Snowflake -> DuckDB 이전. 별도 RAW 적재 단계가 없어졌다.

name: 'together_stay_index'
version: '1.0.0'
config-version: 2

profile: 'together_stay_index'  # profiles.yml 의 target 이름과 일치해야 함

model-paths: ["models"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  together_stay_index:
    staging:
      +schema: silver
      +materialized: view
    marts:
      +schema: gold
      +materialized: table
