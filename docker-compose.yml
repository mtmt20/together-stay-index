# Together-Stay Index 전용 Airflow 스택 (LocalExecutor + Postgres 단일 스택)
# =====================================================================
# 격리 포인트 (기존 프로젝트와 절대 충돌하지 않기 위한 조치):
#   - container_name / volume / network 전부 "tsi_" 접두어로 고유화
#   - 호스트 포트: 웹서버 8090 (기존 위스키 Airflow는 8080 사용 중이라 회피),
#     Postgres 55432 (기본 5432/기존 프로젝트와 겹치지 않도록 회피)
#   - 이미지도 Dockerfile로 별도 빌드 (기존 커스텀 이미지 재사용 안 함)
#   - .env 파일로 자격증명을 주입하며, 그 안의 S3 버킷명도 이 프로젝트
#     전용 이름을 쓰도록 .env.example에 강제 명시
#   - Streamlit 포트 8510 (기존 위스키 Streamlit들은 8501~8504 사용 중이라 회피)
#   - dbt는 상시 구동 서비스가 아니라 `docker compose run --rm tsi-dbt`로만
#     실행되는 "tools" 프로필로 분리 (docker compose up 시 자동 기동 안 됨)
#
# 2026-09-18: Snowflake -> DuckDB 이전. DuckDB는 서버가 아니라 파일 하나라서
# 계정/웨어하우스/키페어가 필요 없다. ./warehouse 폴더를 tsi-dbt와
# tsi-streamlit 양쪽에 마운트해서 같은 .duckdb 파일을 공유한다 (dbt가 쓰고
# Streamlit이 읽음). Snowflake Airflow Connection 등록도 더 이상 없다.

x-airflow-common: &airflow-common
  build: .
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@tsi-postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    # 혼자 쓰는 데모용이라 동시접속 여러 명 가정한 기본 4 workers는 과하다.
    # 2026-09-17: 위스키 스택과 같은 호스트에서 동시에 돌리다 메모리 부족으로
    # gunicorn이 120초 내 응답 못 해 죽는 걸 확인 - 자원 사용량을 줄여둔다.
    AIRFLOW__WEBSERVER__WORKERS: "1"
    # 크롤러/S3 관련 자격증명은 .env 파일에서 주입된다.
    NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
    NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    AWS_S3_BUCKET: ${AWS_S3_BUCKET}
    PYTHONPATH: /opt/airflow/dags
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
  depends_on:
    tsi-postgres:
      condition: service_healthy

services:
  tsi-postgres:
    image: postgres:15
    container_name: tsi_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - tsi_postgres_data:/var/lib/postgresql/data
    ports:
      - "55432:5432"  # 호스트에서 직접 조회하고 싶을 때만 사용, 기본 5432와 충돌 방지
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    networks:
      - tsi_network

  tsi-airflow-init:
    <<: *airflow-common
    container_name: tsi_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username admin --password admin --firstname Together --lastname Stay --role Admin --email admin@example.com || true
    networks:
      - tsi_network

  tsi-airflow-webserver:
    <<: *airflow-common
    container_name: tsi_airflow_webserver
    command: webserver
    # 2026-09-18: gunicorn worker가 120초 내 응답 안 해서 웹서버가 통째로
    # 죽는 간헐적 이슈가 있음 (원인 미확정, DuckDB 이전과 무관 - 이전에도
    # 있었음). DAG 실행 자체는 scheduler가 담당해서 안 죽으므로 영향 없지만,
    # UI 컨테이너가 죽은 채로 방치되지 않도록 자동 재시작을 걸어둔다.
    restart: unless-stopped
    ports:
      - "8090:8080"  # 기존 위스키 Airflow(8080)와 겹치지 않도록 호스트만 8090으로 회피
    depends_on:
      tsi-airflow-init:
        # 단순 depends_on은 "시작"만 기다려서, 최초 `airflow db migrate`가
        # 오래 걸리는 동안 webserver/scheduler가 먼저 떠서 "DB 초기화
        # 안 됨" 에러로 죽는 경합이 있었다 (2026-09-17 최초 기동 시 실제로
        # 재현됨). "완전히 끝날 때까지" 기다리도록 수정.
        condition: service_completed_successfully
    networks:
      - tsi_network

  tsi-airflow-scheduler:
    <<: *airflow-common
    container_name: tsi_airflow_scheduler
    command: scheduler
    depends_on:
      tsi-airflow-init:
        condition: service_completed_successfully
    networks:
      - tsi_network

  tsi-streamlit:
    build: ./streamlit_app
    container_name: tsi_streamlit
    environment:
      DUCKDB_PATH: /data/together_stay.duckdb
    volumes:
      - ./warehouse:/data
    ports:
      - "8510:8501"  # 기존 위스키 Streamlit(8501~8504)과 겹치지 않도록 회피
    networks:
      - tsi_network

  tsi-dbt:
    build:
      context: ./dbt
      dockerfile: Dockerfile
    container_name: tsi_dbt
    profiles: ["tools"]  # `docker compose up`에 포함되지 않음. 수동 실행 전용.
    environment:
      DUCKDB_PATH: /data/together_stay.duckdb
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      DBT_PROFILES_DIR: /dbt
    volumes:
      - ./dbt:/dbt
      - ./warehouse:/data
    working_dir: /dbt
    entrypoint: ["/bin/bash", "run_and_publish.sh"]
    networks:
      - tsi_network

networks:
  tsi_network:
    name: tsi_network

volumes:
  tsi_postgres_data:
    name: tsi_postgres_data
